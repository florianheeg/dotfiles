modelRoles:
  default: anthropic/claude-sonnet-5:medium
  plan: anthropic/claude-sonnet-5:high

  slow: anthropic/claude-opus-5:high
  advisor: anthropic/claude-opus-5:high
  review: anthropic/claude-opus-5:high

  task: anthropic/claude-sonnet-5:medium

  smol: anthropic/claude-haiku-4-5:low
  tiny: anthropic/claude-haiku-4-5:minimal
  commit: anthropic/claude-haiku-4-5:low

  vision: anthropic/claude-sonnet-5:medium

task:
  agentModelOverrides:
    scout: "@smol"
    sonic: "@smol"
    task: "@task"

retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry

  fallbackChains:
    default:
      - github-copilot/gpt-5.6-terra:medium

    plan:
      - github-copilot/gpt-5.6-sol:high

    task:
      - github-copilot/gpt-5.6-terra:medium

    slow:
      - github-copilot/gpt-5.6-sol:high

    advisor:
      - github-copilot/gpt-5.6-sol:high

    review:
      - github-copilot/gpt-5.6-sol:high

    smol:
      - github-copilot/gpt-5.6-luna:low

    tiny:
      - github-copilot/gpt-5.6-luna-utility

    commit:
      - github-copilot/gpt-5.6-luna:low

    vision:
      - github-copilot/gpt-5.6-terra:medium

cycleOrder:
  - smol
  - default
  - slow

modelProviderOrder:
  - anthropic
  - github-copilot

bash:
  patterns:
    - match: "git reset --hard*"
      approval: prompt
    - match: "git clean -f*"
      approval: prompt
    - match: "git restore *"
      approval: prompt
    - match: "git checkout -- *"
      approval: prompt
    - match: "git branch -D*"
      approval: prompt
    - match: "git stash drop*"
      approval: prompt
    - match: "git stash clear*"
      approval: prompt
    - match: "git push --force*"
      approval: prompt
    - match: "git push -f*"
      approval: prompt
    - match: "git push *+*"
      approval: prompt
    - match: "git push *--delete*"
      approval: prompt
    - match: "git filter-repo*"
      approval: prompt
    - match: "git filter-branch*"
      approval: prompt
    - match: "git reflog expire*"
      approval: prompt
    - match: "git gc *--prune=now*"
      approval: prompt
    - match: "git worktree remove *--force*"
      approval: prompt
    - match: "git rebase *"
      approval: prompt
    - match: "git *"
      approval: allow

dev:
  autoqa: false

setupVersion: 2
